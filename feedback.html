<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1c1410">
    <title>رأيك يهمنا</title>
    <link rel="stylesheet" href="vendor/fonts/cairo.css">
    <script src="vendor/supabase.js"></script>
    <style>
        :root { --bg: #f7f2ea; --ink: #1f1a17; --ink2: #6b625a; --line: #ece4d8; --brand: #1c1410; --gold: #c08a3e; --gold-soft: #f6ead6; --bad: #c23b3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', system-ui, sans-serif; }
        button, input, textarea { font-family: inherit; }
        .hero { background: radial-gradient(120% 140% at 100% 0%, #5a3d28 0%, #3a2a20 35%, var(--brand) 75%); color: #fff; padding: 28px 18px 60px; text-align: center; }
        .hero img { width: 76px; height: 76px; border-radius: 22px; background: #fff; object-fit: contain; padding: 6px; }
        .hero h1 { margin: 10px 0 4px; font-size: 24px; font-weight: 900; }
        .hero p { margin: 0; color: #f0e2cd; font-weight: 700; font-size: 14px; line-height: 1.8; }
        .card { max-width: 560px; margin: -36px auto 20px; background: #fff; border-radius: 24px; padding: 20px 18px; box-shadow: 0 10px 30px rgba(28,20,16,.1); }
        .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .kind { border: 2px solid var(--line); background: #fffdf9; border-radius: 16px; padding: 12px 4px; font-weight: 900; font-size: 14px; cursor: pointer; }
        .kind span { display: block; font-size: 26px; }
        .kind.on { border-color: var(--gold); background: var(--gold-soft); }
        .stars { display: flex; justify-content: center; gap: 6px; direction: ltr; margin: 4px 0; }
        .stars button { background: none; border: 0; font-size: 36px; color: #e2d8ca; cursor: pointer; padding: 0 2px; }
        .stars button.on { color: #f0a91c; }
        label { display: block; font-weight: 900; font-size: 14px; margin: 16px 0 6px; }
        .field { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 700; background: #fffdf9; outline: none; }
        .field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(192,138,62,.15); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .primary { width: 100%; background: var(--brand); color: #fff; border: 0; border-radius: 16px; padding: 15px; font-weight: 900; font-size: 16px; margin-top: 18px; cursor: pointer; }
        .primary:disabled { opacity: .5; }
        .muted { color: var(--ink2); font-size: 12px; font-weight: 700; }
        .err { color: var(--bad); font-weight: 800; font-size: 13px; margin-top: 8px; display: none; }
        .done { text-align: center; padding: 20px 4px; }
        .done .ic { font-size: 60px; }
        .links { text-align: center; margin-top: 16px; }
        .links a { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--line); color: var(--brand); text-decoration: none; font-weight: 900; border-radius: 12px; padding: 9px 14px; margin: 4px; }
        .center { text-align: center; padding: 90px 20px; font-weight: 800; color: var(--ink2); }
    </style>
</head>
<body>
    <!-- صفحة الشكاوي والاقتراحات: العميل بيفتحها من رسالة الواتساب أو من الكود اللي على الفاتورة، والمدير بيشوفها في البرنامج -->
    <div id="app"><p class="center">جاري التحميل...</p></div>
    <script src="js/config.js"></script>
    <script>
        const q = new URLSearchParams(location.search);
        const B = q.get('b') || '';
        let F = null, kind = 'complaint', rating = 0;

        async function load() {
            const app = document.getElementById('app');
            try {
                const { data, error } = await _supabase.rpc('feedback_info_public', { p_b: B });
                if (error || !data || !data.ok) { app.innerHTML = '<p class="center">اللينك ده مش صحيح 🙏</p>'; return; }
                F = data;
                document.title = 'رأيك يهمنا | ' + (F.company_name || '');
                if (!F.enabled) { app.innerHTML = `<p class="center">الصفحة دي متوقفة دلوقتي. كلمنا على ${uiEsc(F.phone || 'رقم المحل')} 🙏</p>`; return; }
                render();
            } catch (e) { app.innerHTML = '<p class="center">في مشكلة في النت. حاول تاني 🙏</p>'; }
        }

        function links() {
            return `<div class="links">${F.facebook_url ? `<a href="${uiEsc(F.facebook_url)}" target="_blank" rel="noopener">📘 تابعنا على فيسبوك</a>` : ''}
                ${F.instagram_url ? `<a href="${uiEsc(F.instagram_url)}" target="_blank" rel="noopener">📸 إنستجرام</a>` : ''}</div>`;
        }

        function render() {
            const me = (() => { try { return JSON.parse(localStorage.getItem('motion_menu_me') || '{}') || {}; } catch (e) { return {}; } })();
            document.getElementById('app').innerHTML = `
                <div class="hero">${F.logo ? `<img src="${uiEsc(F.logo)}" alt="">` : ''}<h1>${uiEsc(F.company_name || '')}</h1>
                    <p>${uiEsc(F.intro || 'رأيك يهمنا')}</p></div>
                <div class="card">
                    <div class="kinds">
                        <button class="kind ${kind === 'complaint' ? 'on' : ''}" onclick="setKind('complaint')"><span>😟</span>شكوى</button>
                        <button class="kind ${kind === 'suggestion' ? 'on' : ''}" onclick="setKind('suggestion')"><span>💡</span>اقتراح</button>
                        <button class="kind ${kind === 'praise' ? 'on' : ''}" onclick="setKind('praise')"><span>❤️</span>شكر</button>
                    </div>
                    <label style="text-align:center">قيّم زيارتك</label>
                    <div class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= rating ? 'on' : ''}" onclick="setRating(${n})" aria-label="${n}">★</button>`).join('')}</div>
                    <label>${kind === 'complaint' ? 'حصل إيه؟ احكيلنا بالتفصيل' : kind === 'suggestion' ? 'اقتراحك إيه؟' : 'إيه اللي عجبك؟'} *</label>
                    <textarea class="field" id="msg" rows="5" maxlength="2000" placeholder="اكتب هنا..."></textarea>
                    <div class="row"><div><label>اسمك (اختياري)</label><input class="field" id="name" maxlength="80" value="${uiEsc(me.name || '')}"></div>
                        <div><label>موبايلك (عشان نرد عليك)</label><input class="field" id="phone" type="tel" dir="ltr" style="text-align:right" maxlength="16" value="${uiEsc(me.phone || '')}"></div></div>
                    <label>رقم الطلب أو الفاتورة (لو معاك)</label><input class="field" id="order" maxlength="30" value="${uiEsc(q.get('o') || '')}">
                    <p class="err" id="err"></p>
                    <button class="primary" id="send" onclick="send()">إرسال 🙏</button>
                    <p class="muted" style="text-align:center;margin-top:10px">رسالتك بتوصل للمدير مباشرة.</p>
                    ${links()}
                </div>`;
        }
        function setKind(k) { const m = document.getElementById('msg').value; kind = k; render(); document.getElementById('msg').value = m; }
        function setRating(n) { const m = document.getElementById('msg').value; rating = n; render(); document.getElementById('msg').value = m; }

        async function send() {
            const msg = document.getElementById('msg').value.trim();
            const err = document.getElementById('err');
            if (!msg) { err.textContent = 'اكتب رسالتك الأول'; err.style.display = 'block'; return; }
            const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
            try {
                const { data, error } = await _supabase.rpc('feedback_submit_public', { p_b: B, p_kind: kind, p_rating: rating || null, p_message: msg,
                    p_name: document.getElementById('name').value.trim() || null, p_phone: document.getElementById('phone').value.trim() || null,
                    p_order: document.getElementById('order').value.trim() || null });
                if (error || !data || !data.ok) {
                    err.textContent = { too_many: 'بعت رسايل كتير. جرّب بعد شوية 🙏', invalid_phone: 'رقم الموبايل مش مظبوط', reason_required: 'اكتب رسالتك الأول' }[data && data.reason] || 'تعذر الإرسال. حاول تاني.';
                    err.style.display = 'block'; btn.disabled = false; btn.textContent = 'إرسال 🙏';
                    return;
                }
                document.querySelector('.card').innerHTML = `<div class="done"><div class="ic">${kind === 'praise' ? '❤️' : '🙏'}</div>
                    <h2>شكراً ليك!</h2><p class="muted" style="font-size:15px">${kind === 'complaint' ? 'آسفين جداً على اللي حصل. المدير هيشوف رسالتك ويتابعها بنفسه.' : 'رسالتك وصلت، وبتفرق معانا جداً.'}</p></div>${links()}`;
            } catch (e) { err.textContent = 'في مشكلة في النت. حاول تاني.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'إرسال 🙏'; }
        }
        load();
    </script>
</body>
</html>
