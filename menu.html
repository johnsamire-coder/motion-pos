<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- صفحة الزبون: بتتفتح من كود الـ QR على الطاولة. من غير تسجيل دخول: منيو + نداء ويتر + طلب الحساب -->
    <div id="menu-app" class="max-w-xl mx-auto p-4 pb-28">
        <p class="text-center text-slate-400 font-bold py-20">جاري التحميل...</p>
    </div>
    <div id="menu-actions" class="hidden fixed bottom-0 inset-x-0 bg-white border-t shadow-lg p-3">
        <div class="max-w-xl mx-auto grid grid-cols-2 gap-2">
            <button id="btn-call" onclick="menuRequest('waiter')" class="bg-blue-600 text-white py-3 rounded-2xl font-black text-sm">🙋 نداء الويتر</button>
            <button id="btn-bill" onclick="menuRequest('bill')" class="bg-emerald-600 text-white py-3 rounded-2xl font-black text-sm">🧾 طلب الحساب</button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        const qrToken = new URLSearchParams(location.search).get('t') || '';
        let menuData = null;

        async function loadMenu() {
            const app = document.getElementById('menu-app');
            try {
                const { data, error } = await _supabase.rpc('qr_menu_public', { p_qr: qrToken });
                if (error || !data || !data.ok) {
                    app.innerHTML = `<p class="text-center text-slate-500 font-bold py-20">${data && data.reason === 'qr_disabled' ? 'المنيو مش متاح دلوقتي' : 'الكود ده مش صحيح'}</p>`;
                    return;
                }
                menuData = data;
                document.title = data.company_name || 'المنيو';
                const cur = uiEsc(data.currency || '');
                app.innerHTML = `
                    <div class="text-center mb-5">
                        ${data.logo ? `<img src="${uiEsc(data.logo)}" class="mx-auto max-h-24 mb-2 object-contain">` : ''}
                        <h1 class="font-black text-2xl text-slate-800">${uiEsc(data.company_name || '')}</h1>
                        <p class="text-sm font-bold text-slate-500">${uiEsc(data.branch || '')} | طاولة ${uiEsc(data.table_number)}</p>
                    </div>
                    ${(data.categories || []).map(cat => `
                        <section class="mb-4">
                            <h2 class="font-black text-lg text-blue-700 mb-2 border-b pb-1">${uiEsc(cat.name)}</h2>
                            <div class="space-y-2">${(cat.products || []).map(p => `
                                <div class="bg-white rounded-2xl border p-3 flex justify-between items-center">
                                    <span class="font-bold text-slate-800">${uiEsc(p.name)}</span>
                                    ${data.show_prices ? `<span class="font-black text-emerald-700">${(Number(p.price) || 0).toFixed(2)} ${cur}</span>` : ''}
                                </div>`).join('')}</div>
                        </section>`).join('')}`;
                document.getElementById('btn-call').classList.toggle('hidden', !data.call_waiter);
                document.getElementById('btn-bill').classList.toggle('hidden', !data.request_bill);
                document.getElementById('menu-actions').classList.toggle('hidden', !data.call_waiter && !data.request_bill);
            } catch (err) {
                app.innerHTML = '<p class="text-center text-slate-500 font-bold py-20">في مشكلة في الاتصال. حاول تاني.</p>';
            }
        }

        async function menuRequest(type) {
            try {
                const { data, error } = await _supabase.rpc('qr_request_public', { p_qr: qrToken, p_type: type });
                if (error || !data || !data.ok) {
                    alert(data && data.reason === 'too_many' ? 'طلبات كتير. الويتر جاي حالاً.' : 'تعذر الإرسال. حاول تاني.');
                    return;
                }
                alert(type === 'bill' ? 'تم طلب الحساب ✅ الويتر جاي بالفاتورة' : 'تم النداء ✅ الويتر جاي حالاً');
            } catch (err) {
                alert('في مشكلة في الاتصال. حاول تاني.');
            }
        }

        loadMenu();
    </script>
</body>
</html>
